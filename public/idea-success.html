<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea enviada | Gato Amurrado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/">
                <img src="imagen.avif" alt="Gato logo" class="brand-logo">
                <span class="brand-title">Gato Amurrado</span>
            </a>
            <button class="nav-toggle" aria-expanded="false" aria-controls="main-nav">☰</button>
            <nav id="main-nav" class="main-nav" aria-label="Menú principal">
                <ul>
                    <li><a href="/">Inicio</a></li>
                    <li><a href="/#servicios">Servicios</a></li>
                    <li><a href="/#contacto">Contáctanos</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contenedor-principal">
        <section class="success-section" aria-labelledby="success-title">
            <div class="container">
                <div class="success-container">
                    <div class="success-icon">✓</div>
                    <h1 id="success-title">¡Idea registrada!</h1>
                    <p class="success-description" id="success-name"></p>
                    <p class="success-message">
                        Gracias por compartir tu idea con nosotros. La revisaremos pronto.
                    </p>
                    <div class="success-actions">
                        <a href="/" class="button primary">Volver al Inicio</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>&copy; 2026 - Programación Web IP-CFT Santo Tomás</p>
            <nav aria-label="Enlaces útiles">
                <a href="#">Política</a>
                <a href="#">Contacto</a>
            </nav>
        </div>
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const nombre = params.get('nombre');
        const departamento = params.get('departamento');
        const nameEl = document.getElementById('success-name');
        if (nombre) {
            nameEl.textContent = `Gracias ${decodeURIComponent(nombre)} (${decodeURIComponent(departamento || '')}) por tu idea.`;
        }
    </script>
</body>
</html>
