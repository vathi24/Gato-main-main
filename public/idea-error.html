<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea no enviada | Gato Amurrado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/">
                <img src="imagen.avif" alt="Gato logo" class="brand-logo">
                <span class="brand-title">Gato Amurrado</span>
            </a>
            <button class="nav-toggle" aria-expanded="false" aria-controls="main-nav">☰</button>
            <nav id="main-nav" class="main-nav" aria-label="Menú principal">
                <ul>
                    <li><a href="/">Inicio</a></li>
                    <li><a href="/#servicios">Servicios</a></li>
                    <li><a href="/#contacto">Contáctanos</a></li>
                </ul>
            </nav>

            <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar a modo oscuro">🌙</button>
        </div>
    </header>

    <main class="contenedor-principal">
        <section class="error-section" aria-labelledby="error-title">
            <div class="container">
                <div class="error-container">
                    <div class="error-code">:(</div>
                    <h1 id="error-title">Idea no enviada</h1>
                    <p class="error-description">
                        Para el departamento de Informática, la idea debe tener al menos 20 caracteres.
                    </p>
                    <p class="error-message">
                        Revisa los requisitos e inténtalo de nuevo.
                    </p>
                    <div class="error-actions">
                        <a href="/" class="button primary">Volver al Inicio</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>&copy; 2026 - Programación Web IP-CFT Santo Tomás</p>
            <nav aria-label="Enlaces útiles">
                <a href="#">Política</a>
                <a href="#">Contacto</a>
            </nav>
        </div>
    </footer>
    <script src="darkMode.js"></script>
</body>
</html>
